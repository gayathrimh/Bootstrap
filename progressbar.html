<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap Progress Bars</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>

<div class="container">
  <h2>Bootstrap Progress Bars</h2>

  <p>Basic Progress Bar</p>
  <div class="progress">
    <div class="progress-bar" style="width:40%">
      40%
    </div>
  </div>

  <p>Success Progress Bar</p>
  <div class="progress">
    <div class="progress-bar progress-bar-success" style="width:60%">
      60%
    </div>
  </div>

  <p>Striped Progress Bar</p>
  <div class="progress">
    <div class="progress-bar progress-bar-striped active" style="width:80%">
      80%
    </div>
  </div>
</div>

</body>
</html>
