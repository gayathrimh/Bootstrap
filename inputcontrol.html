<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Input form-control</h2>
       <form class="form-inline">
        <div class="form-group">
            <label class="col-sm-2 control-label" >Focused</label>
            <div class="col-sm-10">
                <input class="form-control" id="focusedinput" placeholder="focused" value="click here to focus">
            </div>
        </div>
        <div class="form-group">
            <label for="disabledInput" class="col-sm-2 control-label">Disabled</label>
            <div class="col-sm-10">
                <input class="form-control" id="disabledInput" placeholder="disabled input here" type="text">
            </div>
        </div>
        <div class="form-group">
            <label for="disabledinput" class="col-sm-2 control-label">Disabled field input</label>
            <div class="col-sm-10">
                <input class="form-control" id="disabledinput" placeholder="disabled input" type="text">
            </div>
        </div>
        <div class="form-group">
          <label for="disabledSelect" class="col-sm-2 control-label">Disabled input</label>
          <div class="col-sm-10">
            <select class="form-control" id="disabledSelect">
                <option>Disabled select</option>
            </select>
          </div>
        </div>
    <div class="form-group has-success has-feedback">
        <label class="col-sm-2 control-label" for="inputSuccess">Input with glyphicon</label>
            <div class="col-sm-10">
                <input class="form-control" type="text" id="inputSuccess">
                <span class="glyphicon glyphicon-ok form-control-feedback">
                </span>
            </div>
        </div>
        <div class="form-group has-warning has-feedback">
            <label class="col-sm-2 control-label" for="inputWarning">Input with warning</label>
            <div class="col-sm-10">
                <input class="form-control" type="text" id="inputWarning">
                <span class="glyphicon glyphicon-warning-sign form-control-feedback"></span>
            </div>
        </div>
        <div class="form-group has-error has-feedback">
            <label for="inputError" class="col-sm-2 control-label">Input with error</label>
            <div class="col-sm-10">
                <input class="form-control" type="text" id="inputError">
                <span class="glyphicon glyphicon-remove form-control-feedback"></span>
            </div>
        </div>
       </form>
    </div>
</body>
</html>
