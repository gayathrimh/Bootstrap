<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Input sizing</h2>
    <form>
        <div class="form-group">
            <label for="defaultInput">Default input</label>
            <input class="form-control" id="defaultInput" type="text">
        </div>
        <div class="form-group">
            <label for="inputlg">Large input</label>
            <input class="form-control input-lg" id="inputlg" type="text">
        </div>
        <div class="form-group">
            <label for="inputsm">Small input</label>
            <input class="form-control input-sm" id="inputsm" type="text">
        </div>
        <div class="form-group">
            <label class="sel1">default</label>
            <select id="sel1" class="form-control">
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </div>
        <div class="form-group">
            <label class="sel2">large</label>
            <select id="sel2" class="form-control input-lg">
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </div>
        <div class="form-group">
            <label class="sel3">small</label>
            <select id="sel3" class="form-control input-sm">
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </div>
    </form>
  </div>  
</body>
</html>
