<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Inline</h2>
        <form class="form-inline">
            <div class="form-group">
                <label for="focusedInput">Focused</label>
                <input type="text" id="focusedInput" class="form-control" placeholder="focused">
            </div>
            <div class="form-group">
                <label for="disabledInput">Disabled</label>
                <input type="text" id="disabledInput" class="form-control" placeholder="disabled">
            </div>
            <div class="form-group has-success has-feedback">
                <label for="inputSuccess">Input with success</label>
                <input type="text" id="inputSuccess">
                <span class="glyphicon glyphicon-ok form-control-feedback"> </span>
            </div>
            <div class="form-group has-warning has-feedback">
                <label for="inputWarning">Input with warning</label>
                <input type="text" id="inputWarning">
                <span class="glyphicon glyphicon-warning-sign form-control-feedback"></span>
            </div>
            <div class="form-group haserror has-feedback">
                <label for="inputError">Input with error</label>
                <input type="text" id="inputError">
                <span class="glyphicon glyphicon-remove form-control-feedback"></span>
            </div>
        </form>
    </div>
</body>
</html>
