<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Input Sizing</h2>
    <form class="form-horizontal">
        <div class="form-group form-group-lg">
            <label for="lg" class="col-sm-2 control-label">Form-group-lg</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="lg">
            </div>
        </div>
        <div class="form-group form-group-sm">
            <label for="sm" class="col-sm-2 control-label">Form-group-sm</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="sm">
            </div>
        </div>
    </form>
</body>
</html>
